[general]
	#Whether to display disclaimer GUI
	DisclaimerShow = false
	#Whether to print animation roulette play message
	PrintAnimationRouletteMsg = false
	#Prevents rendering of self player's model
	DisableSelfModel = false
	#Prevents rendering of other player's model
	DisableOtherModel = false
	#Prevents rendering of self player's hand
	DisableSelfHands = false
	#Prevents rendering of projectile model
	DisableProjectileModel = false
	#Prevents rendering of vehicle model
	DisableVehicleModel = false
	#Disable first person animation from other mods.
	DisableExternalFirstPersonAnim = false
	#If rendering errors occur, try turning on this.
	UseCompatibilityRenderer = false
	#Test renderer.
	UseGpuRenderer = true
	#Native SIMD renderer policy. OFF disables the native path; SAFE and AGGRESSIVE are retained as compatibility modes.
	#Allowed Values: OFF, SAFE, AGGRESSIVE
	NativeSimdPolicy = "AGGRESSIVE"
	#Render ysmGlow bones with normal entity lighting while a shader pack is active.
	DisableModelGlowInShaderpack = true
	#Disable the per-cube face cull baked into models. Turn this on if a model loses faces/parts at certain angles. Changing it reloads models.
	DisableModelFaceCulling = false
	#Allowed Values: ORIGINAL, CUSTOM
	RouletteContentMode = "ORIGINAL"
	#The amount of volume when the animation is played.
	# Default: 100.0
	# Range: 0.0 ~ 100.0
	SoundVolume = 100.0
	#Whether to display model ID first in the model selection screen, instead of the model name filled in by the model author.
	ShowModelIdFirst = false
	#Default presentation of the model selection grid. AUTO shows 3D cards when the list area is big enough and falls back to the classic icon+text grid otherwise. CARDS forces the card catalog (falls back only when not even one readable card fits). LIST forces the classic grid.
	#Allowed Values: AUTO, CARDS, LIST
	ModelPickerStyle = "AUTO"

[Integration]
	SophisticatedBackpack = true
	Parcool = true

[ExperimentalTesting]
	#Per-frame animation profiler for diagnosing animation stutter. Default off.
	AnimationFrameProfiler = false
	#Verbose per-evaluation [SM-ANIM] debug log. Very noisy, default off.
	AnimationDebugLog = false
	#Allow panel-state writeback in the developer group. Default off; enabling it lets a model author reproduce a captured panel state. Client-side only.
	DeveloperStateWriteback = false
	#Print [SM-ROULETTE] diagnostics for animation roulette clicks, server resolution, and client playback resolution. Default off.
	AnimationRouletteDebugLog = false
	#Print [SM-INPUT] diagnostics for attack/use mouse clicks, key state, vanilla swing/use state, and local animation pulses.
	InputStateDebugLog = false
	#Warn when the same entity is fully evaluated more than once in a single render frame.
	WarnRepeatedAnimationEvaluation = true
	#Reduce animation update rates for distant entities. Disabled by default for smoother animation.
	AnimationDistanceLod = false
	#Use the incubating Java Vector API for part of the Java fallback renderer. Experimental, default off, and requires launching with --add-modules jdk.incubator.vector.
	ExperimentalJavaVectorRenderer = false
	#Verbose resource station network/probe logging. Default off.
	ResourceStationMonitorLog = false
	#Verbose client/server online model sync diagnostics. Default off.
	NetworkOnlineDebugLog = false
	#Model memory profiler for read/decrypt/parse/texture/GPU/LRU checkpoints. Default off.
	ModelMemoryProfiler = false
	#Print [SM][Perf] timing logs for model import, upload, and reload checkpoints. Default off.
	ModelImportPerformanceLog = false
	#Maximum decoded audio cache bytes across all client models. 0 disables decoded audio caching.
	# Default: 67108864
	# Range: 0 ~ 536870912
	AudioCacheMaxBytes = 67108864
	#Maximum models whose GPU/native render caches stay resident. 0 disables LRU trimming.
	# Default: 24
	# Range: 0 ~ 512
	MaxCachedGpuModels = 24
	#Load local and cached server models only when they are first rendered or selected.
	LazyModelLoading = true
	#Use local models only and block all Sparkle Morpher client-to-server traffic.
	PrivacyMode = false
	#Maximum models whose CPU geometry and animation data stay resident. Idle models reload from their source when used again.
	# Default: 64
	# Range: 1 ~ 512
	MaxResidentCpuModels = 64
	#Minimum idle time before GPU/native render caches can be trimmed.
	# Default: 300
	# Range: 30 ~ 86400
	UnusedModelTtlSeconds = 300

[extra_player_render]
	#Legacy inverse switch for classic HUD rendering
	DisablePlayerRender = true
	#Whether to enable the independent modern HUD renderer
	EnableModernHudRender = false
	#Classic HUD layout: position, continuous scale and yaw
	# Default: 10
	# Range: > 0
	PlayerPosX = 10
	# Default: 10
	# Range: > 0
	PlayerPosY = 10
	# Default: 40.0
	# Range: 8.0 ~ 360.0
	PlayerScale = 40.0
	# Default: 0.0
	# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
	PlayerYawOffset = 0.0
	#Modern HUD layout: position, continuous scale and yaw (independent of classic HUD)
	# Default: 10
	# Range: > 0
	ModernPlayerPosX = 10
	# Default: 10
	# Range: > 0
	ModernPlayerPosY = 10
	# Default: 40.0
	# Range: 8.0 ~ 360.0
	ModernPlayerScale = 40.0
	# Default: 0.0
	# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
	ModernPlayerYawOffset = 0.0
	#Classic HUD doll head mode: STRAIGHT (head faces same way as body) or FOLLOW (head tracks the player's look direction)
	#Allowed Values: STRAIGHT, FOLLOW
	ClassicHudHeadMode = "STRAIGHT"
	#Classic HUD doll anchor corner; the X/Y layout values become offsets from this anchor (TOP_LEFT keeps legacy absolute positions)
	#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, MIDDLE_LEFT, MIDDLE_CENTER, MIDDLE_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
	ClassicHudAnchor = "TOP_LEFT"
	#Hide the classic HUD doll in third-person view (F5)
	ClassicHudHideInThirdPerson = false
	#Auto-hide the classic HUD doll after this many idle seconds (0 disables auto-hide)
	# Default: 0
	# Range: 0 ~ 3600
	ClassicHudAutoHideIdleSeconds = 0
	#Show the classic HUD doll only while the player is performing an action
	ClassicHudShowOnActionOnly = false
	#Align the classic HUD doll with the ridden vehicle's yaw
	ClassicHudAlignWithVehicle = false

[loading_state_screen]
	#Whether to disable loading state screen
	DisableLoadingStateScreen = false
	#Loading state screen position
	#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
	LoadingStatePosition = "TOP_CENTER"
	#Horizontal offset of the loading state popup from its anchor, in GUI pixels
	# Default: 0
	# Range: -10000 ~ 10000
	LoadingStateOffsetX = 0
	#Vertical offset of the loading state popup from its anchor, in GUI pixels
	# Default: 0
	# Range: -10000 ~ 10000
	LoadingStateOffsetY = 0
	#Seconds before the loading state popup hides after success or failure
	# Default: 4
	# Range: 1 ~ 30
	LoadingStateAutoHideSeconds = 4
